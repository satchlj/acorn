# Builds the Linux AppImages for a release and attaches them to it, signed with the key the
# app's updater (acorn-update) checks. Copy into the app's public repo as
# .github/workflows/linux-appimages.yml, and replace OWNER/APP and the PREFIX_UPDATE_KEY
# secret and variable names (PUZIL_UPDATE_KEY and PUZIL_UPDATE_KEY_FILE for Puzil). Runs
# when a release is published, or by hand for an existing tag.
name: Linux AppImages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.1.3
        required: true

permissions:
  contents: write

jobs:
  appimage:
    if: github.repository == 'OWNER/APP'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev file
      - name: Build and sign
        env:
          KEY: ${{ secrets.PREFIX_UPDATE_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          PREFIX_UPDATE_KEY_FILE="$RUNNER_TEMP/key.pem" tools/acorn.sh linux/appimage.sh
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.AppImage.sig --clobber

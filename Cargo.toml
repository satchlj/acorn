[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/satchlj/acorn"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.10.0", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
acorn-app = { path = "crates/acorn-app" }
acorn-theme = { path = "crates/acorn-theme" }
acorn-kit = { path = "crates/acorn-kit" }

[profile.dev.package."*"]
opt-level = 2

# GPUI's macOS renderer and platform, patched (see vendor/*/ACORN.md). Apps apply the same
# patch in their own workspace (a [patch] only counts in the root workspace).
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

[package]
name = "acorn-spell"
description = "Spellchecking for GPUI text fields: wavy underlines, suggestions from the keyboard and right-click, and autocorrect, using the macOS system checker or Hunspell"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0 AND MIT AND BSD-3-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
acorn-app.workspace = true
acorn-theme.workspace = true
acorn-kit.workspace = true
spellbook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSRange", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
